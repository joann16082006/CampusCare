{% extends "base.html" %}

{% block title %}Delete Grievance - CampusCare{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">

        <div class="card cc-card mt-4" style="border-top: 5px solid #b3261e;">
            <div class="card-body p-4 p-md-5 text-center">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
                <h1 class="h3 mt-3 mb-2">Delete this grievance?</h1>
                <p class="text-muted mb-4">
                    You are about to delete <b>“{{ grievance.title }}”</b>. This cannot be undone.
                </p>

                <form method="post" class="d-flex justify-content-center gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash me-1"></i>Yes, Delete
                    </button>
                    <a href="{% url 'grievance_detail' grievance.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
