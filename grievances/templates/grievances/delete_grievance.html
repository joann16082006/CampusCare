
<!DOCTYPE html>
<html>
<head>
    <title>Delete Grievance</title>
</head>
<body>
    <h2>Delete Grievance</h2>

    <p>Are you sure you want to delete "{{ grievance.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Delete</button>
    </form>

    <a href="{% url 'my_grievances' %}">Cancel</a>
</body>
</html>
