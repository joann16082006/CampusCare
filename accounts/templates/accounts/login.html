{% extends "base.html" %}

{% block title %}Login - CampusCare{% endblock %}
{% block body_class %}cc-auth-bg{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="col-md-6 col-lg-4">
        <div class="card cc-card cc-card-accent">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-mortarboard-fill fs-1" style="color: var(--cc-primary);"></i>
                    <h1 class="h3 cc-page-title mt-2 mb-0">CampusCare</h1>
                    <p class="text-muted mb-0">Sign in to your account</p>
                </div>

                <form method="post" class="cc-form">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-cc w-100 py-2 mt-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Login
                    </button>
                </form>

                <p class="text-center mt-4 mb-0">
                    New user? <a href="{% url 'register' %}" class="fw-semibold">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
